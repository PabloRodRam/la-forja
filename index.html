<style>
/* Layout: app de una columna (máx. 720px), pestañas abajo, barra de temporizador fija sobre ellas */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface2:#E3E8EF; --ink:#141B2B; --muted:#5B6577; --line:#D3DAE4;
  --accent:#2448D8; --accent-ink:#FFFFFF; --xp:#E39A00; --ok:#16935B; --warn:#C2410C;
  --fig:#141B2B; --prop:#2448D8; --mbase:#DCE1E9; --mus:#BDC5D2; --mp:#E5484D; --ms:#F4A9A0;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1320; --surface:#171E2E; --surface2:#222B3E; --ink:#E8EDF6; --muted:#97A2B6; --line:#2C3650;
  --accent:#6E8BFF; --accent-ink:#0E1320; --xp:#FFC043; --ok:#3CCB86; --warn:#FF8A4C; --fig:#E8EDF6; --prop:#6E8BFF; --mbase:#2A3346; --mus:#435071; --mp:#FF5A5F; --ms:#A3545A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1320; --surface:#171E2E; --surface2:#222B3E; --ink:#E8EDF6; --muted:#97A2B6; --line:#2C3650;
  --accent:#6E8BFF; --accent-ink:#0E1320; --xp:#FFC043; --ok:#3CCB86; --warn:#FF8A4C; --fig:#E8EDF6; --prop:#6E8BFF; --mbase:#2A3346; --mus:#435071; --mp:#FF5A5F; --ms:#A3545A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
html{height:100%;overflow:hidden}
body{height:100%;margin:0;overflow:hidden;display:flex;flex-direction:column}
.wrap{flex:1 1 auto;min-height:0;width:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-left:max(16px,calc(50% - 344px),env(safe-area-inset-left,0px));padding-right:max(16px,calc(50% - 344px),env(safe-area-inset-right,0px));padding-block:16px 110px;display:flex;flex-direction:column;gap:16px}
.wrap>*{flex:none}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}

/* Cabecera de jugador */
.player{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.lvl{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:800;font-size:28px;line-height:1}
.lvl small{display:block;font-size:10px;font-weight:600;letter-spacing:.1em;text-align:center}
.player .name{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--xp);border-radius:99px;transition:width .5s}
.xpline{font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.streak{text-align:center;min-width:56px}
.streak .num{font-size:30px;font-weight:800;color:var(--warn);line-height:1}
.streak .eyebrow{font-size:10px}

/* Semana */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 2px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.day b{font-family:var(--display);font-size:18px;font-weight:700;line-height:1.1}
.day span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day .st{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-top:2px;display:grid;place-items:center;font-size:11px;font-weight:700}
.day.today{border-color:var(--accent)}
.day.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.day.sel span{color:inherit;opacity:.8}
.day .st.done{background:var(--ok);border-color:var(--ok);color:#fff}
.day .st.part{border-color:var(--xp);background:linear-gradient(90deg,var(--xp) 50%,transparent 50%)}
.weeknav{display:flex;justify-content:space-between;align-items:center}
.weeknav button{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;color:var(--muted)}

/* Fase del plan */
.phase{background:var(--surface);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.phase .row{display:flex;gap:6px}
.phase .seg{flex:1;height:6px;border-radius:99px;background:var(--surface2)}
.phase .seg.on{background:var(--accent)}
.phase p{margin:0;font-size:14px;color:var(--muted)}
.phase p b{color:var(--ink)}

/* Sesión */
.sess-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sess-head h2{font-size:34px;font-weight:800;line-height:1}
.sess-head .meta{color:var(--muted);font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.tag.done{background:var(--ok);color:#fff}
.note{font-size:13px;color:var(--muted);background:var(--surface);border-radius:10px;padding:10px 12px;margin:0}
.list{display:flex;flex-direction:column;gap:10px}
.ex{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center}
.ex .title{font-weight:600;font-size:15px}
.ex .reps{font-size:13px;color:var(--muted)}
.ex .info{min-width:0}
.how{background:var(--surface2);border:0;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.how svg{width:14px;height:14px}
.sets{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.set{width:38px;height:38px;border-radius:10px;border:2px solid var(--line);background:transparent;font-family:var(--display);font-weight:700;font-size:16px;color:var(--muted);display:grid;place-items:center;transition:transform .12s,background .15s}
.set.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.set:active{transform:scale(.92)}
.kg{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.kg input{width:64px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;text-align:right}
.pr{font-size:11px;font-weight:700;color:var(--xp)}
.ex.complete{box-shadow:inset 0 0 0 2px var(--ok)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* Técnica */
.lib-group{display:flex;flex-direction:column;gap:8px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--surface);border:0;border-radius:var(--r);padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px}
.card .cv{display:grid;grid-template-columns:1.25fr 1fr;align-items:center;gap:2px;background:var(--bg);border-radius:10px;padding:4px}
.card .cv svg{width:100%;height:auto;display:block}
.thumb{width:56px;height:54px;padding:3px;border:0;border-radius:10px;background:var(--bg);grid-row:span 1}
.thumb svg{width:100%;height:100%;display:block}
.anat-svg .mb{fill:var(--mbase)}
.anat-svg .mu{fill:var(--mus);stroke:var(--bg);stroke-width:.9;stroke-linejoin:round}
.anat-svg .mu.s{fill:var(--ms)}
.anat-svg .mu.p{fill:var(--mp)}
.anat-svg .sep{stroke:var(--bg);stroke-width:.9;fill:none}
.anat-svg .al{font:700 9px var(--body);letter-spacing:.12em;fill:var(--muted);text-anchor:middle}
.tut-top{display:grid;grid-template-columns:1.35fr 1fr;gap:10px;align-items:stretch}
.anat{background:var(--bg);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;justify-content:center}
.anat .anat-svg{width:100%;height:auto;display:block}
.anat-leg{display:flex;flex-direction:column;gap:4px;font-size:12px;line-height:1.35}
.anat-leg div{display:flex;gap:6px;align-items:flex-start}
.sw{width:10px;height:10px;border-radius:3px;flex:none;margin-top:3px}.sw.p{background:var(--mp)}.sw.s{background:var(--ms)}
.stage{display:flex;align-items:center;justify-content:center;min-height:100%}
.stage svg{padding-top:22px}
@media (max-width:520px){.tut-top{grid-template-columns:1fr}.anat{flex-direction:row;align-items:center}.anat .anat-svg{width:52%}.anat-leg{flex:1}}
.card b{font-size:13px;font-weight:600}

/* Logros */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border-radius:12px;padding:10px;text-align:center}
.stat .num{font-size:28px;font-weight:800;line-height:1.1}
.stat .eyebrow{font-size:10px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{background:var(--surface);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px}
.badge .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);color:var(--muted)}
.badge .ic svg{width:22px;height:22px}
.badge.on .ic{background:var(--xp);color:#1b1300}
.badge b{font-size:14px}
.badge span{font-size:12px;color:var(--muted)}
.badge:not(.on){opacity:.6}
.ladder{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.ladder div{display:flex;justify-content:space-between;color:var(--muted)}
.ladder div.cur{color:var(--ink);font-weight:700}

/* Tabs */
.tabs{position:relative;flex:none;z-index:20;box-shadow:0 -4px 14px rgba(0,0,0,.08);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.tabs nav{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tabs button{background:none;border:0;padding:9px 2px 10px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.tabs button svg{width:27px;height:27px;flex:none}
.tabs button[aria-current="page"] svg{transform:scale(1.08)}
.tabs button[aria-current="page"]{color:var(--accent)}

/* Temporizador */
.timer{position:fixed;left:0;right:0;z-index:19;bottom:calc(72px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.timer .in{max-width:696px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.timer .lbl{font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer .sub{font-size:11px;opacity:.7}
.timer .clock{font-family:var(--display);font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;grid-row:1/3;grid-column:2}
.timer .clock.work{color:var(--xp)}
.timer .ctl{grid-column:1/-1;display:flex;gap:8px}
.timer .ctl button{background:rgba(127,127,127,.25);border:0;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;color:inherit}
.timer .tbar{grid-column:1/-1;height:4px;border-radius:99px;background:rgba(127,127,127,.3);overflow:hidden}
.timer .tbar i{display:block;height:100%;background:var(--xp)}
.timer .in>:first-child{min-width:0}
.timer .lbl{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
.timer .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer .clock{white-space:nowrap;justify-self:end}
.timer .ctl{flex-wrap:wrap}
.timer .ctl button{flex:1 1 auto;min-width:0}
body.t90on .wrap{padding-bottom:230px}
.mat90{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:4px;font-size:11px;color:var(--muted)}
.mat90 .ml{font-weight:700}
.mat90 .m90{background:var(--surface2);color:var(--ink);border-radius:99px;padding:2px 8px;font-weight:600}
.mat90 .m90.none{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.mat90 .mo{flex-basis:100%}
.mat90.big{font-size:13px;margin:0}
.mat90.big .m90{padding:4px 10px}
.mat90s{font-size:13px;background:var(--surface2);border-radius:12px;padding:10px 12px;line-height:1.45}
.how.rpb{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.rptut{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;padding:12px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15px}
.btn.rptut span{font-size:11px;font-weight:600;opacity:.85}
.ov.rp90{align-items:stretch;justify-content:center;background:var(--bg);z-index:40}
.rp90 .rpin{flex:1 1 auto;min-width:0;box-sizing:border-box;width:100%;max-width:520px;margin:0 auto;height:100%;overflow-y:auto;padding:max(12px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.rp90 header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.rp90 header h3{margin:2px 0 0;font-size:20px}
.rp90 .close{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:22px}
.rp90 .rpstage{position:relative;min-width:0;flex:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rp90 .rpstage canvas,.rp90 .rpstage svg{display:block;width:min(100%,calc(46vh * 110 / 106));height:auto;aspect-ratio:110/106;margin:0 auto}
.rp90 .rpph{position:absolute;left:10px;top:10px;font-size:12px;font-weight:700;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:4px 10px}
.rp90 .rpcount{display:flex;align-items:center;justify-content:center;gap:18px}
.rp90 .rpcount>div{text-align:center;min-width:120px}
.rp90 .rpcount b{display:block;font-family:var(--display);font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.rp90 .rpcount span{font-size:13px;color:var(--muted)}
.rp90.goal .rpcount b{color:var(--xp)}
.rp90 .rpadj{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:24px;font-weight:700}
.rp90 .rpbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.rp90 .rpbar i{display:block;height:100%;width:0;background:var(--xp);transition:width .3s}
.rp90 .rpcue{font-size:14px;line-height:1.4}
.rp90 .rpopts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rp90 .rpseg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rp90 .rpseg button,.rp90 .rpv{border:0;background:var(--surface);color:var(--ink);padding:8px 12px;font-size:13px;font-weight:700}
.rp90 .rpseg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.rp90 .rpv{border:1px solid var(--line);border-radius:10px}
.rp90 .rpv[aria-pressed="false"]{opacity:.6}
.rp90 .rpgo{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.rp90 .rpgo button{border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:800}
.rp90 .rppause{background:var(--surface);color:var(--ink);border:1px solid var(--line)!important}
.rp90 .rpdone{background:var(--accent);color:var(--accent-ink)}
.rp90 .rpsteps summary{font-weight:700;cursor:pointer}
.rp90 .rpsteps ol{margin:8px 0 0;padding-left:20px;font-size:14px;line-height:1.45}

/* Modal tutorial */
.ov{position:fixed;inset:0;z-index:40;background:rgba(8,12,22,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:20px}}
.sheet header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet h3{font-size:28px;font-weight:800;line-height:1.05}
.close{background:var(--surface2);border:0;border-radius:99px;width:36px;height:36px;font-size:20px;line-height:1;flex:none}
.stage{background:var(--bg);border-radius:14px;position:relative}
.stage svg{display:block;width:100%;max-width:340px;margin:0 auto;height:auto}
.stage .phase-lbl{position:absolute;left:12px;top:10px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stage .speed{position:absolute;right:10px;top:8px;display:flex;gap:4px}
.stage .speed button{background:var(--surface);border:1px solid var(--line);border-radius:6px;font-size:11px;padding:2px 8px;font-weight:600}
.stage .speed button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface2)}
.sheet h4{margin:0 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sheet ol,.sheet ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sheet ul.err li::marker{color:var(--warn)}
.tip{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:14px}

/* Celebración / toasts */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--xp);color:#1b1300;font-weight:700;padding:8px 16px;border-radius:99px;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.2);animation:pop .3s ease-out;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
@keyframes pop{from{transform:translate(-50%,-10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.celebrate{background:var(--surface);border-radius:20px;padding:26px 22px;max-width:360px;width:calc(100% - 32px);text-align:center;display:flex;flex-direction:column;gap:10px;align-self:center}
.celebrate .big{font-family:var(--display);font-size:54px;font-weight:800;color:var(--xp);line-height:1}
.celebrate h3{font-size:28px}
.celebrate p{margin:0;color:var(--muted)}
.ov.center{align-items:center}
.sync{font-size:11px;color:var(--muted);text-align:center}
/* Juego: avatar, monedas, jefe, misiones, cofres, tienda */
.player{grid-template-columns:auto 1fr auto}
.avatar{width:62px;height:74px;border-radius:14px;background:var(--surface);border:0;padding:0;flex:none}
.avatar svg{width:100%;height:100%;display:block}
.lvtag{font-family:var(--display);font-size:14px;font-weight:700;background:var(--accent);color:var(--accent-ink);padding:1px 7px;border-radius:6px;vertical-align:2px;margin-left:4px}
.ptitle{font-size:12px;color:var(--muted);font-style:italic;min-height:1em}
.pstats{display:flex;flex-direction:column;gap:8px;align-items:center}
.coins{display:flex;align-items:center;gap:4px;font-family:var(--display);font-weight:800;font-size:20px;color:var(--xp);font-variant-numeric:tabular-nums;line-height:1}
.coin{width:16px;height:16px;flex:none;vertical-align:-3px}
.boss{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center}
.boss svg{width:84px;height:84px;display:block}
.boss.hit svg{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-5px) rotate(-4deg)}40%{transform:translateX(5px) rotate(4deg)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.boss h3{font-size:22px;line-height:1.1}
.boss .small{font-size:12px;color:var(--muted)}
.hp{height:12px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.hp i{display:block;height:100%;background:var(--warn);transition:width .5s}
.boss.dead .hp i{background:var(--ok)}
.mission{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center}
.mission .mk{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-weight:700}
.mission.ok .mk{background:var(--ok);border-color:var(--ok);color:#fff}
.mission .txt{flex:1;min-width:0;font-size:14px}
.mission .rw{font-size:12px;font-weight:700;color:var(--xp);white-space:nowrap}
.freeze{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
.freeze p{margin:0;flex:1;min-width:200px}
.day .st.frz{background:#5AA9E6;border-color:#5AA9E6;color:#fff}
.chests{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.chest{background:var(--surface);border:0;border-radius:var(--r);padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.chest svg{width:64px;height:56px}
.chest b{font-size:13px}.chest span{font-size:11px;color:var(--muted)}
.chest:hover svg,.chest:focus-visible svg{animation:wiggle .6s}
@keyframes wiggle{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.empty{background:var(--surface);border-radius:var(--r);padding:14px;font-size:14px;color:var(--muted);margin:0}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.item{background:var(--surface);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:6px}
.item .pv{background:var(--bg);border-radius:10px;height:112px;display:grid;place-items:center;overflow:hidden}
.item .pv svg{height:100%;width:auto}
.item .pv .ttl{font-family:var(--display);font-size:20px;font-weight:700;text-align:center;padding:0 8px}
.item b{font-size:13px}
.rar{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rar.raro{color:var(--accent)}.rar.épico{color:var(--xp)}
.item .btn{padding:8px 10px;font-size:13px;justify-content:center;margin-top:auto}
.item.eq{box-shadow:inset 0 0 0 2px var(--accent)}
.hero-av{background:var(--surface);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:center}
.hero-av svg{width:110px;height:130px;background:var(--bg);border-radius:12px;display:block}
.hero-av h2{font-size:28px}
.btn svg{width:16px;height:16px;flex:none}
.hero-av svg.coin{width:18px;height:18px;background:none;border-radius:0;display:inline-block;vertical-align:-3px}
.strblk{display:flex;flex-direction:column;gap:12px;padding-top:14px;border-top:1px dashed var(--line)}
.hero-av .phys{font-size:13px;color:var(--muted);margin-top:4px}.hero-av .phys b{color:var(--ink)}
.evo{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.evo .row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(max-content,1fr);gap:8px;align-items:start;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.evo .row::-webkit-scrollbar{display:none}
.evo .st{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.evo .st svg{width:64px;flex:none;height:auto;aspect-ratio:60/106;background:var(--bg);border-radius:10px;display:block}
.evo .st b{font-size:12px;line-height:1.2;white-space:nowrap}
.evo .st span{font-size:11px;color:var(--muted)}
.evo .st.lock svg{opacity:.35;filter:grayscale(1)}
.evo .st.cur svg{outline:2px solid var(--accent);outline-offset:-2px}
.evo .bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}.evo .bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.hero-av .inv{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:14px;color:var(--muted)}
.hero-av .inv b{color:var(--ink);font-family:var(--display);font-size:20px}
.medal{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:5px;align-self:flex-start}
.medal.bronce{background:#C98A55;color:#2a1607}.medal.plata{background:#C5CDD8;color:#1d2530}.medal.oro{background:#E9B92F;color:#2a1d00}.medal.nada{background:var(--surface2);color:var(--muted)}
.mastery{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.chestbig{width:120px;height:105px;margin:0 auto;display:block;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.shaking .chestbig{animation:shake .35s infinite}
.reward{display:flex;flex-direction:column;gap:8px;align-items:center}
.reward .pv{background:var(--bg);border-radius:12px;width:120px;height:130px;display:grid;place-items:center}
.reward .pv svg{height:100%;width:auto}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
/* Reps, sugerencias, esfuerzo */
.repsrow{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.repsrow input{width:38px;height:30px;padding:0;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 14px var(--body);text-align:center}
.repsrow span{font-size:11px;color:var(--muted)}
.sugg{grid-column:1/-1;font-size:12px;color:var(--muted);background:var(--bg);border-radius:8px;padding:6px 10px}
.sugg b{color:var(--ok)}
.rpe{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.rpe .opts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rpe .opts button{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:0;font-size:11px;color:var(--muted)}
.rpe .opts button b{font-family:var(--display);font-size:20px;color:var(--ink)}
.rpe .opts button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rpe .opts button[aria-pressed="true"] b{color:inherit}
/* Progreso */
.form{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.form input,.form select,.sxsel{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:15px;width:110px}
.form input[type=date]{width:150px}
.sxsel{width:auto;max-width:100%}
.chartcard{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.chartcard h3{font-size:20px}
.chartcard .sub{font-size:12px;color:var(--muted)}
.chart{position:relative;width:100%;min-height:180px}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axl{font:500 11px var(--body);fill:var(--muted)}
.chart .vl{font:700 12px var(--body);fill:var(--ink)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .xh{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart .tt{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-120%)}
details.tbl summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:600}
details.tbl table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;font-variant-numeric:tabular-nums}
details.tbl td,details.tbl th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right}
details.tbl td:first-child,details.tbl th:first-child{text-align:left}
details.tbl button{background:none;border:0;color:var(--warn);font-size:12px;font-weight:600}
/* Amigos */
.board{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.board .row{display:grid;grid-template-columns:24px 1fr auto auto auto;gap:10px;align-items:center;font-size:14px}
.board .row.me{font-weight:700}
.board .row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .row .n{font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums;text-align:right}
.board .hd{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.item .lock{font-size:11px;color:var(--muted)}
@media (max-width:420px){.tabs button{font-size:11.5px;letter-spacing:-.01em}.rpe .opts button span{font-size:9px}.sess-head h2{font-size:28px}.stats{grid-template-columns:repeat(2,1fr)}.set{width:34px;height:34px}}
.rar.temporada{color:#1E9E8F}
.small{font-size:12px;color:var(--muted)}.muted{color:var(--muted)}
.player>*{min-width:0}.pstats .gear{margin-top:-4px}
.gear{background:none;border:0;padding:2px;color:var(--muted);width:30px;height:30px;display:grid;place-items:center;border-radius:8px}.gear svg{width:20px;height:20px}
.exb{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.swb{background:transparent;border:1px solid var(--line)}
.swi{font-size:11px;color:var(--accent);font-weight:600}
.pwarn{font-size:11px;color:var(--warn);font-weight:700}
.week .st.md{background:var(--xp);color:#2A2238;font-size:10px;font-weight:800}
.warmblk{border-top:0;padding-top:0}
.adj{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.adj .small{margin:0}.adj .small b{color:var(--ink)}
.seg[role=group],.setsec .seg,.pz .seg{display:flex;gap:4px;background:var(--surface2);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg[role=group] button,.setsec .seg button,.pz .seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 6px;font-weight:700;font-size:13px;color:var(--muted);min-width:0}
.seg[role=group] button[aria-pressed=true],.setsec .seg button[aria-pressed=true],.pz .seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.pz .seg button[aria-pressed=true][data-pl="2"]{color:var(--warn)}.pz .seg button[aria-pressed=true][data-pl="3"]{background:var(--warn);color:#fff}
.linkb{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:13px;text-align:left;text-decoration:underline;text-underline-offset:3px}
.painbox{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 3px 0 0 var(--warn)}
.painbox ul{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.painz{display:flex;flex-direction:column;gap:10px}.pz{display:flex;flex-direction:column;gap:4px}.pz b{font-size:13px}
.swl{display:flex;flex-direction:column;gap:8px}
.acts{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}.acts .note{margin:0}
.actit{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--bg)}.actit b{flex:1;font-size:14px}.actit span{color:var(--muted);font-size:13px}
.actit button{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px}
.acts .form{background:var(--bg);padding:10px}.acts .form select{width:150px}.acts .form input{width:80px}
.chg{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12px;color:var(--muted)}
.swim{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}.swim p{margin:0}
.wkf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.wkf label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.wkf select{padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.swo{display:flex;gap:12px;align-items:center;text-align:left;background:var(--bg);border:2px solid transparent;border-radius:12px;padding:8px 10px;color:var(--ink)}
.swo[aria-pressed=true]{border-color:var(--accent)}
.swo .th{width:52px;height:50px;flex:none}.swo .th svg{width:100%;height:100%;display:block}
.swo .tx{display:flex;flex-direction:column;gap:2px;min-width:0}.swo .tx span{font-size:12px;color:var(--muted)}.swo .tx .pw{color:var(--warn);font-weight:700}
.stepsc{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.stepsc h3 small{font-size:14px;color:var(--muted);font-weight:600}
.sbar,.mbar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}.sbar i,.mbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.mbar{height:6px}
.src{font-size:12px;color:var(--muted)}.src b{color:var(--ink);font-variant-numeric:tabular-nums}
.walk{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.walk.on{background:var(--bg);border-radius:10px;padding:8px 10px;justify-content:space-between;box-shadow:inset 3px 0 0 var(--ok)}
.stepsf{background:var(--bg);padding:10px}.stepsf input{width:130px}
.pet{background:var(--surface);border-radius:var(--r);padding:10px 14px;display:flex;gap:12px;align-items:center}
.pet h3{font-size:20px;line-height:1.1}
.petav{width:74px;height:74px;flex:none;border:0;background:var(--bg);border-radius:14px;padding:2px}.petav svg{width:100%;height:100%;display:block;overflow:visible}
.pet .pbody{transform-origin:50% 90%;animation:petb 2.6s ease-in-out infinite}
.pet.happy .pbody{animation:peth 1s ease-in-out infinite}.pet.sleep .pbody{animation:petb 5s ease-in-out infinite}
.petav.pat .pbody{animation:petp .5s ease}
@keyframes petb{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
@keyframes peth{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes petp{0%{transform:scale(1)}30%{transform:scale(1.15,.85)}60%{transform:scale(.92,1.1)}100%{transform:scale(1)}}
.season{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 0 0 2px #1E9E8F}
.season .sh{display:flex;gap:12px;align-items:center}.season .pv{width:64px;height:76px;flex:none;background:var(--bg);border-radius:12px;display:grid;place-items:center}.season .pv svg{width:100%;height:100%}
.season h3{font-size:20px}.sch{display:flex;flex-direction:column;gap:4px}.sch .t{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600}.sch.ok .t{color:var(--ok)}.sch.ok .mbar i{background:var(--ok)}
.heat .yn{display:flex;gap:6px;align-items:center}.heat .yn button{background:var(--surface2);border:0;border-radius:8px;width:30px;height:30px;font-size:18px}.heat .yn button[disabled]{opacity:.35}
.hgrid{display:flex;flex-direction:column;gap:3px;overflow-x:auto}
.hr{display:grid;grid-template-columns:30px repeat(31,minmax(7px,1fr));gap:2px;align-items:center}.hr span{font-size:10px;color:var(--muted);text-transform:capitalize}
.hc{display:inline-block;aspect-ratio:1;border-radius:2px;background:var(--surface2);min-width:7px;cursor:pointer}.hx{visibility:hidden}
.hc.l1{background:color-mix(in srgb,var(--accent) 35%,var(--surface2))}.hc.l2{background:color-mix(in srgb,var(--accent) 65%,var(--surface2))}.hc.l3{background:var(--accent)}.hc.fz{background:var(--xp)}.hc.hf{opacity:.35;cursor:default}
.hleg{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted)}.hleg span{display:inline-flex;gap:5px;align-items:center}.hleg .hc{width:11px;height:11px;min-width:0;cursor:default}
.setsec{display:flex;flex-direction:column;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}.setsec:last-child{border-bottom:0}
.setsec .form{background:var(--bg)}.setsec p{margin:0}
.tg{display:flex;gap:10px;align-items:center;font-size:14px}.tg input{width:20px;height:20px;accent-color:var(--accent)}
.tm{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);padding-left:30px}.tm input{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.bkt summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600}.bkt textarea{width:100%;margin-top:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:12px ui-monospace,monospace;padding:8px;box-sizing:border-box}
.confirm{background:var(--bg);border-radius:10px;padding:10px 12px;box-shadow:inset 3px 0 0 var(--warn)}.confirm p{margin:0 0 8px;font-size:14px}
/* v10: material, rutinas propias, semana en detalle, resumen, gomas */
.gearg{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.gch{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer;min-height:36px}
.gch input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.gch:has(input:checked){background:var(--accent);color:var(--accent-ink)}
.genprev{background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.gpd{display:grid;grid-template-columns:44px 1fr;gap:8px;font-size:14px;align-items:start}
.gpd span{display:flex;flex-direction:column}.gpd small{color:var(--muted);font-size:12px;line-height:1.35}
.mine{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:8px 10px}
.mine .tx{flex:1;min-width:0;display:flex;flex-direction:column}.mine .tx span{font-size:13px;color:var(--muted)}

  const full=r=>!!r&&ss.items.every(([id,n])=>cnt(r.sets[id])>=n);

  else if(ss.kind==="deporte"){opts.push({t:"Practica 45 minutos o más",c:r=>actMin(r)>=45});opts.push({t:"Apunta una actividad de intensidad alta",c:r=>!!r&&(r.acts||[]).some(a=>a.int===3)});}
  else{
    opts.push({t:`Completa todas las ${ss.kind==="circuito"?"vueltas":ss.kind==="hiit"?"partes":"series"} de hoy, sin dejarte ninguna`,c:full});
    if(ss.kind==="fuerza")opts.push({t:"Anota los kg en 3 ejercicios",c:r=>!!r&&Object.values(r.kg||{}).filter(v=>parseFloat(v)>0).length>=3});
    if((ss.kind==="fuerza"||ss.kind==="circuito"||ss.kind==="natacion")&&ss.items.length){const it=ss.items[h%ss.items.length];opts.push({t:`Completa todas las series de ${EX[it[0]].n}`,c:r=>!!r&&cnt(r.sets[it[0]])>=it[1]});}
    if(ss.kind==="hiit")opts.push({t:"Aguanta las 12 rondas del HIIT",c:r=>!!r&&cnt(r.sets.sprint)>=12});

  }
  const m=opts[(h>>>4)%opts.length];return {txt:m.t,check:r=>!!m.c(r)};
}

/* ================= v21: cuenta atrás, expediciones, mazmorra y avisos ================= */
function countOn(){return lsK("pq.count","1")!=="0";}
const fmtD21=k=>{const d=fromKey(k);return ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"][d.getDay()]+" "+d.getDate();};
const fem21=n=>/^(Hidra|Gárgola)/.test(n);const al21=n=>(fem21(n)?"a la ":"al ")+n;const el21=n=>(fem21(n)?"la ":"el ")+n;const El21=n=>(fem21(n)?"La ":"El ")+n;const dead21=n=>n+(fem21(n)?" derrotada":" derrotado");
function hash21(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function restDay21(k){try{return sessFor(k).kind==="descanso";}catch(e){return false;}}

/* ---------- expediciones ---------- */
function expS(){const P=petsS();if(!Array.isArray(P.exp))P.exp=[];return P.exp;}
function expBack(e){return key(addDays(fromKey(e.k),e.d));}
function expAway(id){return expS().find(e=>e.id===id&&!e.c)||null;}
function expKept(e){let n=0;for(let i=0;i<e.d;i++){const k=key(addDays(fromKey(e.k),i));if(k>TK)break;if(isKept(k)||restDay21(k))n++;}return n;}
function expReady(e){return !e.c&&TK>=expBack(e);}
const EXPN={1:"Bosque cercano",2:"Cueva de cristal",3:"Montaña del dragón"};
function expRew(e,kept){const p=petById(e.id);const m=p?PRAR[p.r].m:1;const full=kept===e.d;return {coin:Math.round(kept*20*m)+(full?e.d*15:0),xp:kept*15+(full?e.d*10:0),full};}
/* lo que suman las expediciones recogidas (se llama desde compute) */
function exp21(PXP,chests){const o={xp:0,coin:0};for(const e of (S.pets&&Array.isArray(S.pets.exp)?S.pets.exp:[])){if(!e.c)continue;o.xp+=e.xp||0;o.coin+=e.coin||0;PXP[e.id]=(PXP[e.id]||0)+(e.kept||0);
  if(e.full&&e.d===3)chests.push({id:"x:"+e.id+e.k,type:"normal",src:"Expedición de "+petName(e.id)});}return o;}
function claimExp(i){const e=expS()[i];if(!e||!expReady(e))return;const before=compute();const kept=expKept(e);const r=expRew(e,kept);
  e.c=TK;e.kept=kept;e.coin=r.coin;e.xp=r.xp;e.full=r.full;
  let egg=null;if(r.full&&e.d>=2){const h=hash21(e.id+e.k)%100;if(h<(e.d===3?45:20)){const pool=PETS.filter(x=>!petsS().own[x.id]&&(x.r==="común"||x.r==="raro"));if(pool.length){egg=pool[hash21(e.k+e.id)%pool.length];petsS().own[egg.id]={k:TK};e.egg=egg.id;}}}
  save();render();const nm=petName(e.id);
  const msg=kept===0?`${nm} ha vuelto con las manos vacías: no entrenaste esos días. La próxima vez, cumple y traerá botín.`
    :`${nm} ha vuelto de su expedición (${EXPN[e.d]}: ${kept} de ${e.d} ${e.d===1?"día cumplido":"días cumplidos"}): +${r.coin} monedas y +${r.xp} XP. Además, gana ${kept} ${kept===1?"paso":"pasos"} de evolución.${r.full&&e.d===3?" Trae un cofre.":""}${egg?` ¡Y ha encontrado un huevo de ${egg.n}! Ya está en tu granja.`:""}`;
  celebrate(kept?"¡Vuelve la expedición!":"Expedición fallida",kept?`+${r.coin} monedas`:"",msg);void before;}
function expAwayHtml(e){return `<div class="expbox"><b>De expedición: ${EXPN[e.d]}</b><div class="small">${expReady(e)?"¡Ya ha vuelto! Recoge su botín.":"Vuelve el "+fmtD21(expBack(e))+". Trae botín solo si entrenas esos días."}</div>${expReady(e)?`<button class="btn" type="button" data-expc="${expS().indexOf(e)}">Recoger</button>`:""}</div>`;}

const DUNG=[{n:"Gárgola del Sábado",c:"#7A8699",shape:"horns",d:"Se pasa la semana quieta en el tejado esperando que llegue el finde."},
 {n:"Trasgo de la Siesta",c:"#4FA36B",shape:"ghost",d:"Aparece después de comer y te convence de que mañana es mejor día."},
 {n:"Mímico de la Nevera",c:"#C98B2E",shape:"block",d:"Parece un tentempié. Es una trampa."},

function satOf(k){const d=fromKey(k),g=d.getDay();return g===6?k:g===0?key(addDays(d,-1)):null;}
function dungOf(sat){const i=Math.floor((fromKey(sat).getTime()+6*36e5)/(7*864e5));return DUNG[((i%4)+4)%4];}
function dungDone(sat){const v=(S.dung||{})[sat];return !!(v&&v.done);}
function dung21(dmg,chests){const o={xp:0,coin:0,frz:0};for(const [sat,v] of Object.entries(S.dung||{})){if(!v||!v.done)continue;const k=v.k||sat;o.xp+=80;o.coin+=40;o.frz++;const mon=key(monday(fromKey(k)));dmg[mon]=(dmg[mon]||0)+25;chests.push({id:"dg:"+sat,type:"epico",src:dungOf(sat).n});}return o;}
function dungFinish(){const sat=satOf(TK);if(!sat||dungDone(sat))return;const before=compute();S.dung=S.dung||{};S.dung[sat]={done:true,k:TK};save();render();const a=compute();const mb=dungOf(sat);
  const extra=a.bosses.length>before.bosses.length?" ¡Y el golpe extra ha tumbado al jefe de la semana!":"";
  celebrate("¡Mazmorra superada!",`+${a.xp-before.xp} XP`,`Has derrotado ${al21(mb.n)}: +40 monedas, un cofre épico, un comodín para recuperar un día perdido y 25 golpes extra ${al21(bossOf(key(monday(TODAY))).n)}.${extra}`,`<button class="btn ghost" type="button" data-go="botin" style="justify-content:center">Ir a abrir el cofre</button>`);}
function dungTimer(){const sat=satOf(TK);if(!sat)return;const mb=dungOf(sat);const segs=[];const NR=3,NE=DGEX.length,HP=NR*NE;let n=0;
  segs.push({lbl:"Prepárate",sub:mb.n+" · "+HP+" de vida",secs:10,say:`Mazmorra del fin de semana. ${mb.n}. Tres vueltas de cinco ejercicios. Prepárate.`});
  for(let r=0;r<NR;r++){DGEX.forEach((id,i)=>{const left=HP-n;n++;
    segs.push({lbl:EX[id].n,sub:`Vuelta ${r+1} de ${NR} · ${mb.n}: ${left} de vida`,secs:35,work:true,say:(i===0?(r===NR-1?"Última vuelta. ":`Vuelta ${r+1}. `):"")+EX[id].n+". ¡Dale!",onEnd:r===NR-1&&i===NE-1?dungFinish:null});
    if(i<NE-1)segs.push({lbl:"Cambia: "+EX[DGEX[i+1]].n,sub:"15 s para cambiar",secs:15,say:"Cambia. Siguiente: "+EX[DGEX[i+1]].n});});
    if(r<NR-1)segs.push({lbl:"Descanso",sub:`${El21(mb.n)} se tambalea`,secs:60,say:"Un minuto de descanso. Está tocado."});}
  startTimer(segs,`¡${dead21(mb.n)}!`);}
function dungHtml(){const sat=satOf(TK);if(!sat)return "";const mb=dungOf(sat);

    <div class="actions"><button class="btn" type="button" data-dgo>${icons.play} Entrar en la mazmorra</button><button class="btn ghost" type="button" data-dgm>Ya la he hecho</button></div></div></div>`;}

/* ================= v22: comida de las mascotas ================= */
const BELLY=12;
const FOOD={carne:{i:"🍖",n:"carne",f:"las series de fuerza"},fruta:{i:"🍎",n:"fruta",f:"el cardio, el HIIT y el deporte"},hierba:{i:"🌿",n:"hierbas",f:"el calentamiento, los estiramientos y la movilidad"}};
function favFood(id){const p=petById(id);if(!p)return null;return ({fue:"carne",pr:"carne",cri:"carne",car:"fruta",act:"fruta",mob:"hierba",mis:"hierba"})[p.b]||(p.b==="foe"?["carne","fruta","hierba"][hash21(id)%3]:null);}
/* bocados que da un día: cada serie es uno (fuerza = carne, cardio = fruta, movilidad = hierbas) */
function food21(r){const o={carne:0,fruta:0,hierba:0};if(!r)return o;
  for(const [id,a] of Object.entries(r.sets||{})){const q=cnt(a),kd=exKind(id);if(!q)continue;if(kd==="str")o.carne+=q;else if(kd==="cardio")o.fruta+=q;else o.hierba+=q;}
  o.hierba+=Object.values(r.warm||{}).filter(Boolean).length+Object.values(r.str||{}).filter(Boolean).length;
  o.fruta+=Math.floor(actMin(r)/10);return o;}
function belly21(id,f){const fv=favFood(id);let n=0;for(const t in f)n+=f[t]*(t===fv?2:1);return n;}

   <div class="form"><label>Fecha<input type="date" id="bDate" value="${TK}" max="${TK}"></label><label>Peso (kg)<input id="bW" inputmode="decimal" placeholder="${lw??"80,0"}"></label><label>Cintura (cm)<input id="bC" inputmode="decimal" placeholder="${lc??"90"}"></label><label>Cadera (cm)<input id="bH" inputmode="decimal" placeholder="${(bk.filter(k=>S.body[k].h>0).map(k=>S.body[k].h).pop())??"100"}"></label><button class="btn" type="button" data-act="body">Guardar</button></div>
   <div class="stats"><div class="stat"><div class="num">${lw??"—"}</div><div class="eyebrow">Peso (kg)</div></div><div class="stat"><div class="num">${dl(ws,"kg")}</div><div class="eyebrow">Desde el inicio</div></div><div class="stat"><div class="num">${lc??"—"}</div><div class="eyebrow">Cintura (cm)</div></div><div class="stat"><div class="num">${dl(cs,"cm")}</div><div class="eyebrow">Desde el inicio</div></div></div>
   ${whrHtml25(bk)}
   ${heatHtml()}
   ${stepsChart()}
   ${sportStats()}
   ${card("Peso","kg por medida",ws,"kg","chW")}
   ${card("Cintura","cm por medida",cs,"cm","chC")}
   <div class="chartcard"><h3>Fuerza</h3>${exs.length?`<label class="sub">Ejercicio <select class="sxsel" data-sx>${exs.map(id=>`<option value="${id}"${id===progEx?" selected":""}>${EX[id].n}</option>`).join("")}</select></label>${strength.length>=2?`<div class="chart" id="chS" data-unit="kg" data-pts='${JSON.stringify(strength)}'></div>`:`<p class="empty" style="padding:10px 0;background:none">Con una sesión más con kg verás la línea.</p>`}`:`<p class="empty" style="padding:10px 0;background:none">Anota los kg en tus ejercicios de fuerza para ver aquí cómo subes.</p>`}</div>
   ${marks27()}
  ${bk.length?`<details class="tbl"><summary>Ver todas las medidas (${bk.length})</summary><table><thead><tr><th>Fecha</th><th>Peso</th><th>Cintura</th><th>Cadera</th><th></th></tr></thead><tbody>${rows}</tbody></table></details>`:""}
  </div>`;
}
const nf=v=>String(v).replace(".",",");
function fmtD(k){const d=fromKey(k);return d.getDate()+"/"+(d.getMonth()+1);}
function drawCharts(){document.querySelectorAll(".chart[data-pts]").forEach(drawChart);}
function drawChart(el){
  let pts;try{pts=JSON.parse(el.dataset.pts);}catch(e){return;}if(!pts||pts.length<2)return;const unit=el.dataset.unit||"";
  const W=Math.max(260,Math.round(el.clientWidth||600)),H=190,ml=40,mr=46,mt=14,mb=24;
  const xs=pts.map(p=>fromKey(p.k).getTime());const x0=Math.min(...xs),x1=Math.max(...xs);
  let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));const raw=Math.max((hi-lo)/3,.1);const st=[.5,1,2,5,10,20,50].find(x=>x>=raw)||100;lo=Math.floor((lo-st*.3)/st)*st;hi=Math.ceil((hi+st*.3)/st)*st;const nT=Math.round((hi-lo)/st);
  const X=t=>ml+(x1===x0?.5:(t-x0)/(x1-x0))*(W-ml-mr),Y=v=>mt+(1-(v-lo)/(hi-lo))*(H-mt-mb);
  let g="";for(let i=0;i<=nT;i++){const v=lo+st*i;const y=Y(v);g+=`<line class="grid" x1="${ml}" x2="${W-mr}" y1="${f1(y)}" y2="${f1(y)}"/><text class="axl" x="${ml-6}" y="${f1(y+4)}" text-anchor="end">${nf(r1(v))}</text>`;}
  g+=`<text class="axl" x="${ml}" y="${H-6}">${fmtD(pts[0].k)}</text><text class="axl" x="${W-mr}" y="${H-6}" text-anchor="end">${fmtD(pts[pts.length-1].k)}</text>`;
  const P2=pts.map((p,i)=>[X(xs[i]),Y(p.v)]);
  const line=`<path class="ln" d="M${P2.map(q=>f1(q[0])+" "+f1(q[1])).join(" L")}"/>`;
  const dots=P2.map(q=>`<circle class="pt" cx="${f1(q[0])}" cy="${f1(q[1])}" r="4"/>`).join("");
  const lp=P2[P2.length-1];const lab=`<text class="vl" x="${f1(lp[0]+8)}" y="${f1(lp[1]+4)}">${nf(pts[pts.length-1].v)}</text>`;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Evolución en ${unit}">${g}${line}<line class="xh" y1="${mt}" y2="${H-mb}" x1="-10" x2="-10"/>${dots}${lab}<rect x="${ml}" y="0" width="${W-ml-mr}" height="${H}" fill="transparent"/></svg><div class="tt" hidden></div>`;
  const svg=el.querySelector("svg"),tt=el.querySelector(".tt"),xh=el.querySelector(".xh");
  const mv=e=>{const rc=svg.getBoundingClientRect();const x=(e.clientX-rc.left)*W/rc.width;let bi=0;P2.forEach((q,i)=>{if(Math.abs(q[0]-x)<Math.abs(P2[bi][0]-x))bi=i;});
    const q=P2[bi];xh.setAttribute("x1",q[0]);xh.setAttribute("x2",q[0]);tt.hidden=false;tt.textContent=`${fmtD(pts[bi].k)} · ${nf(pts[bi].v)} ${unit}`;
    tt.style.left=(q[0]*rc.width/W)+"px";tt.style.top=(q[1]*rc.height/H)+"px";};
  svg.addEventListener("pointermove",mv);svg.addEventListener("pointerdown",mv);
  svg.addEventListener("pointerleave",()=>{tt.hidden=true;xh.setAttribute("x1",-10);xh.setAttribute("x2",-10);});
}
let rsT=null;window.addEventListener?.("resize",()=>{clearTimeout(rsT);rsT=setTimeout(drawCharts,150);});
function bind(){
  const v=document.getElementById("view");
  v.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{sel=b.dataset.day;render();});
  v.querySelectorAll("[data-wk]").forEach(b=>b.onclick=()=>{sel=key(addDays(fromKey(sel),+b.dataset.wk));render();});
  v.querySelectorAll("[data-tut]").forEach(b=>b.onclick=()=>openTut(b.dataset.tut));
  v.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>markSet(sel,b.dataset.set,+b.dataset.i));
  v.querySelectorAll("[data-str]").forEach(b=>b.onclick=()=>markStr(sel,b.dataset.str,!((S.days[sel]||{}).str||{})[b.dataset.str]));
  v.querySelectorAll("[data-rep]").forEach(i=>i.onchange=()=>setRep(sel,i.dataset.rep,+i.dataset.i,i.value.trim()));
  v.querySelectorAll("[data-rpe]").forEach(b=>b.onclick=()=>setRpe(sel,+b.dataset.rpe));
  v.querySelectorAll("[data-delbody]").forEach(b=>b.onclick=()=>delBody(b.dataset.delbody));
  v.querySelectorAll("[data-sx]").forEach(x=>x.onchange=()=>{progEx=x.value;render();});
  v.querySelectorAll("[data-kg]").forEach(i=>i.onchange=()=>setKg(sel,i.dataset.kg,i.value.replace(",",".").trim()));
  v.querySelectorAll("[data-chest]").forEach(b=>b.onclick=()=>{const ch=compute().pending.find(x=>x.id===b.dataset.chest);if(ch)openChest(ch);});
  v.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>buy(b.dataset.buy));
  v.querySelectorAll("[data-equip]").forEach(b=>b.onclick=()=>equip(b.dataset.equip));
  v.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{const a=b.dataset.act;
    if(a==="stretch")stretchTimer(sel);
    if(a==="circuit")circuitTimer(sel);if(a==="hiit")hiitTimer(sel,+b.dataset.r);if(a==="ride")rideTimer(sel);
    if(a==="rest")restTimer();
    if(a==="restlen"){try{localStorage.setItem("pq.rest",restSecs()===90?60:90)}catch(e){}render();}
    if(a==="autorest"){try{localStorage.setItem("pq.autorest",autoRest()?"0":"1")}catch(e){}render();}
    if(a==="freeze")useFreeze(sel,true);if(a==="unfreeze")useFreeze(sel,false);
    if(a==="body")setBody(document.getElementById("bDate").value,document.getElementById("bW").value,document.getElementById("bC").value,document.getElementById("bH").value);
    if(a==="finish")finishSession(sel);if(a==="reopen")reopen(sel);
    if(a==="plan")openPlan(sel);if(a==="addact")addAct(sel);
    if(a==="warm")warmTimer(sel);if(a==="pain")openPain();
    if(a==="painok"){S.pain[TK]=[];save();toast("Me alegro. Sin dolor anotado");render();}
    if(a==="steps"){const i=document.getElementById("stIn");if(i)setStepsManual(sel,i.value);}
    if(a==="walk"){const A=AND();try{if(A&&A.walkStart){const ok=A.walkStart();toast(ok===false?"Activa la ubicación para la caminata GPS":"Caminata GPS en marcha: puedes bloquear el móvil");setTimeout(render,800);}}catch(e){}}
    if(a==="walkstop"){const A=AND();try{if(A&&A.walkStop)A.walkStop();}catch(e){}setTimeout(()=>{pullSteps();render();},600);}
    if(a==="stepperm"){const A=AND();try{A&&A.requestPerm&&A.requestPerm("steps");}catch(e){}}
    if(a==="pet"){const pv=v.querySelector(".petav");if(pv){pv.classList.remove("pat");void pv.offsetWidth;pv.classList.add("pat");}beep(880,.06);setTimeout(()=>beep(1175,.08),90);buzz([30]);}
  });
  v.querySelectorAll("[data-warm]").forEach(b=>b.onclick=()=>markWarm(sel,b.dataset.warm,!((S.days[sel]||{}).warm||{})[b.dataset.warm]));
  v.querySelectorAll("[data-swap]").forEach(b=>b.onclick=()=>openSwap(sel,b.dataset.swap));
  v.querySelectorAll("[data-swl]").forEach(b=>b.onclick=()=>setSwim(sel,b.dataset.swl));
  v.querySelectorAll("[data-pool]").forEach(b=>b.onclick=()=>{S.cfg.pool=+b.dataset.pool;save();render();});
  v.querySelectorAll("[data-aint]").forEach(b=>b.onclick=()=>{actInt=+b.dataset.aint;v.querySelectorAll("[data-aint]").forEach(x=>x.setAttribute("aria-pressed",x===b));});
  v.querySelectorAll("[data-delact]").forEach(b=>b.onclick=()=>delAct(sel,+b.dataset.delact));
  const acM=document.getElementById("acM");if(acM)acM.onkeydown=e=>{if(e.key==="Enter")addAct(sel);};
  v.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>setMode(sel,b.dataset.mode||null));
  v.querySelectorAll("[data-hy]").forEach(b=>b.onclick=()=>{heatY=(heatY||TODAY.getFullYear())+ +b.dataset.hy;render();});
  v.querySelectorAll("[data-hk]").forEach(b=>b.onclick=()=>{const k=b.dataset.hk;const d=fromKey(k);const cap=document.getElementById("heatCap");
    if(k>TK){if(cap)cap.textContent=`${d.getDate()} de ${MESES[d.getMonth()]}: aún no ha llegado.`;return;}
    sel=k;tab="hoy";render();(document.getElementById("app").scrollTop=0);});
  const si=document.getElementById("stIn");if(si)si.onkeydown=e=>{if(e.key==="Enter")setStepsManual(sel,si.value);};
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();(document.getElementById("app").scrollTop=0);});
document.getElementById("avatar").onclick=()=>{tab="botin";render();(document.getElementById("app").scrollTop=0);};
document.getElementById("gear").onclick=()=>openSettings();
document.addEventListener("visibilitychange",()=>{if(!document.hidden){pullSteps();if(tab==="hoy"&&!document.querySelector(".ov"))render();}});
setInterval(()=>{if(document.hidden)return;pullSteps();const ws=document.getElementById("walkSt");if(ws){const w=walkSt();if(w.on)ws.textContent=`${fmtKm(w.dist)} · +${fmtN(w.extra)} pasos que el podómetro no ha contado`;}},15000);
boot();
</script>
